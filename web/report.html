<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Report · Tallyline</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  try { const t = JSON.parse(localStorage.getItem('tl.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/report.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script type="module" src="/js/report.js"></script>
</head>
<body class="report">
<div id="progress" aria-hidden="true"></div>
<div class="rp-bar no-print">
  <a class="wordmark" href="/" title="Back to Tallyline"><span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 12V7M6.5 12V4M10 12V8.5M13.5 12V5.5"/></svg></span><span>Tallyline</span></a>
  <span class="muted">Printable report</span>
  <span class="spacer"></span>
  <button class="btn" id="copyBtn">Copy link</button>
  <a class="btn" id="backLink" href="/">Open in app</a>
  <button class="btn primary" id="printBtn">Print / save as PDF</button>
</div>
<main class="rp" id="report" aria-busy="true"><div class="state"><h3>Building the report…</h3></div></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
