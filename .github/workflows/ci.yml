name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check tallyline tests
      - run: ruff format --check tallyline tests
      - run: pytest
      - name: JavaScript syntax
        run: for f in web/js/*.js web/js/*/*.js; do node --check "$f"; done
